<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Presente — práticas para estar bem agora</title>
  <meta name="description" content="Escolha uma dimensão e receba uma prática baseada em pesquisa: respiração guiada, gratidão, visualização, movimento, contemplação, música, humor e bondade." />
  <meta name="theme-color" content="#fbfbfd" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Presente" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Presente</h1>
    <p class="hero-sub">O que você precisa agora?</p>
    <p class="hero-note">Escolha uma dimensão e receba uma prática para este momento, com base em pesquisas publicadas.</p>
  </header>

  <main>
    <section id="cards" class="cards" aria-label="Dimensões de prática"></section>
  </main>

  <footer class="footer">
    <p>Estas práticas são um convite ao cuidado — não substituem acompanhamento médico ou psicológico.</p>
  </footer>

  <!-- Tela da prática sorteada -->
  <div id="overlay" class="overlay" hidden>
    <div class="practice-card" role="dialog" aria-modal="true" aria-labelledby="practice-dim">
      <button id="close-btn" class="close-btn" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="practice-head">
        <span id="practice-icon" class="practice-icon" aria-hidden="true"></span>
        <span id="practice-dim" class="practice-dim"></span>
      </div>
      <div id="breath-guide" class="breath-guide" hidden></div>
      <div id="practice-img-wrap" class="practice-img-wrap" hidden>
        <img id="practice-img" alt="Imagem para contemplação" />
      </div>
      <p id="practice-text" class="practice-text"></p>
      <div id="practice-science" class="practice-science" hidden>
        <p id="practice-why" class="practice-why"></p>
        <p id="practice-source" class="practice-source"></p>
      </div>
      <p id="practice-note" class="practice-note" hidden></p>
      <div class="practice-actions">
        <button id="done-btn" class="btn btn-primary">Concluir</button>
        <button id="another-btn" class="btn btn-ghost">Outra prática</button>
      </div>
      <p id="practice-count" class="practice-count"></p>
    </div>
  </div>

  <script src="js/data/visualizacao.js"></script>
  <script src="js/data/gratidao.js"></script>
  <script src="js/data/respiracao.js"></script>
  <script src="js/data/movimentos.js"></script>
  <script src="js/data/contemplacao.js"></script>
  <script src="js/data/musicas.js"></script>
  <script src="js/data/humor.js"></script>
  <script src="js/data/bondade.js"></script>
  <script src="js/breath.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
