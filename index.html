<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presente — práticas para estar bem agora</title>
  <meta name="description" content="Escolha uma dimensão e receba uma prática para este momento: respiração, gratidão, visualização, movimento, contemplação, música, humor e bondade." />
  <meta name="theme-color" content="#faf6f0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Presente" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Presente</h1>
    <p class="hero-sub">O que o seu coração precisa <em>agora</em>?</p>
    <p class="hero-note">Toque em um card e receba uma prática para este momento — inspirada em neurociência, medicina chinesa, fé e amor.</p>
  </header>

  <main>
    <section id="cards" class="cards" aria-label="Dimensões de prática"></section>
  </main>

  <footer class="footer">
    <p>Feito com amor. Estas práticas são um convite ao cuidado — não substituem acompanhamento médico ou psicológico.</p>
  </footer>

  <!-- Tela da prática sorteada -->
  <div id="overlay" class="overlay" hidden>
    <div class="practice-card" role="dialog" aria-modal="true" aria-labelledby="practice-dim">
      <button id="close-btn" class="close-btn" aria-label="Voltar">×</button>
      <div class="practice-head">
        <span id="practice-emoji" class="practice-emoji"></span>
        <span id="practice-dim" class="practice-dim"></span>
      </div>
      <div id="practice-img-wrap" class="practice-img-wrap" hidden>
        <img id="practice-img" alt="Imagem para contemplação" />
      </div>
      <p id="practice-text" class="practice-text"></p>
      <p id="practice-why" class="practice-why"></p>
      <div class="practice-actions">
        <button id="done-btn" class="btn btn-primary">Feito 🤍</button>
        <button id="another-btn" class="btn btn-ghost">Quero outra</button>
      </div>
      <p id="practice-count" class="practice-count"></p>
    </div>
  </div>

  <script src="js/data/visualizacao.js"></script>
  <script src="js/data/gratidao.js"></script>
  <script src="js/data/respiracao.js"></script>
  <script src="js/data/movimentos.js"></script>
  <script src="js/data/contemplacao.js"></script>
  <script src="js/data/musicas.js"></script>
  <script src="js/data/humor.js"></script>
  <script src="js/data/bondade.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
